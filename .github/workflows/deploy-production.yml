name: Build and Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_DIR: ${{ vars.APP_DIR || '/opt/sportgearhub-web-admin' }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  WEB_ADMIN_IMAGE: ${{ vars.WEB_ADMIN_IMAGE || 'production' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID || 'sportgearhub-web-admin' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER VITE_API_BASE_URL DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment configuration::$name is required"
              missing=1
            fi
          done
          if [ "$VITE_OIDC_CLIENT_ID" != "sportgearhub-web-admin" ]; then
            echo "::error title=Invalid deployment configuration::VITE_OIDC_CLIENT_ID must be sportgearhub-web-admin"
            missing=1
          fi
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID || 'sportgearhub-web-admin' }}
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:$WEB_ADMIN_IMAGE" \
            .

      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:$WEB_ADMIN_IMAGE"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/docker-compose.yml"

      - name: Deploy on target host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' WEB_ADMIN_IMAGE='$WEB_ADMIN_IMAGE' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          mv /tmp/docker-compose.yml "$APP_DIR/docker-compose.yml"
          rm -f "$APP_DIR/compose.yml"

          cat > "$APP_DIR/.env" <<ENVEOF
          WEB_ADMIN_IMAGE=$WEB_ADMIN_IMAGE
          ENVEOF

          docker network inspect apps-proxy >/dev/null 2>&1 || docker network create apps-proxy

          cd "$APP_DIR"
          if docker compose version >/dev/null 2>&1; then
            docker compose pull
            docker compose up -d --remove-orphans
          else
            docker-compose pull
            docker-compose up -d --remove-orphans
          fi
          EOF
