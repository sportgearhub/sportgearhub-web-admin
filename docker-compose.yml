services:
  sportgearhub-web-admin:
    container_name: sportgearhub-web-admin
    image: "${WEB_ADMIN_IMAGE:-ghcr.io/sportgearhub/sportgearhub-web-admin:production}"
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_HTTP_PORT:-8081}:80"
    networks:
      apps-proxy:
        aliases:
          - sportgearhub-web-admin

networks:
  apps-proxy:
    external: true
